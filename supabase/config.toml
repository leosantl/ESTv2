[project]
id = "standcontrol"

[api]
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
port = 54323

[inbucket]
port = 54324

[storage]
file_size_limit = "50MiB"

[auth]
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/reset-password",
  "http://localhost:5173/invite",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false

[edge_runtime]
policy = "per_worker"

# Cron: check-subscriptions runs daily at 06:00 UTC
[[cron]]
name = "check-subscriptions-daily"
schedule = "0 6 * * *"
function = "check-subscriptions"
